interface:
  display_name: "Word Control"
  short_description: "Safely edit the active Word document in place"
  default_prompt: "Use $word-control to work directly with the active desktop Word document. Confirm the document, back up important files, inspect a fresh selection or table/object fingerprint, make one narrow text, row, column, border, shading, or equation change, verify its readback, and clean task-only scratch files."
